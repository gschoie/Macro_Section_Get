name: Macro Section Bot

on:
  schedule:
    # 슬롯(KST 07:00 / 10:30 / 15:00 / 21:00)마다 시작 틱 1개 + 폴백 틱 1개.
    # 잡이 --serve-slot 으로 6개 섹션을 잡 안에서 10분 간격 순차 발송한다.
    # (10분 간격 6틱 크론은 GitHub 무료 러너 스로틀로 슬롯당 1~2틱만 발화 — 실측 후 전환)
    # 폴백 틱은 시작 틱이 유실됐을 때만 실제로 돌고, 아니면 90분 중복 가드로 즉시 종료.
    # UTC = KST-9h.
    - cron: "0,20 22 * * *"   # KST 07:00 (+폴백 07:20)
    - cron: "30,50 1 * * *"   # KST 10:30 (+폴백 10:50)
    - cron: "0,20 6 * * *"    # KST 15:00 (+폴백 15:20)
    - cron: "0,20 12 * * *"   # KST 21:00 (+폴백 21:20)
  workflow_dispatch: {}

# 폴백 틱이 서빙 중인 잡과 겹치면 뒤 run이 줄을 선다(취소 아님) — 상태 파일 경합 방지.
# 줄을 선 폴백은 서빙 완료 후 시작돼 90분 가드에 걸려 즉시 종료된다.
concurrency:
  group: macro-section-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    # --serve-slot 은 10분 간격 6회 발송으로 잡이 ~55분 돈다 (public 리포 = 러너 무제한).
    timeout-minutes: 75
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 크로미엄을 매번 새로 받으면 실행당 3분+ — 캐시로 실행시간을 1분 수준으로 줄인다.
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # 변경 감지 + 회전 포인터 상태를 실행 간 유지 (없으면 매번 전부 "변경"으로 잡힘).
      - name: Restore change-detection state
        uses: actions/cache@v5
        with:
          path: macro_section_state.json
          key: macro-state-${{ github.run_id }}
          restore-keys: |
            macro-state-

      - name: Run bot
        env:
          # 이 repo의 secret 이름은 MACRO_ 접두 → 봇이 읽는 범용 env명으로 매핑
          TELEGRAM_BOT_TOKEN: ${{ secrets.MACRO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MACRO_TELEGRAM_CHAT_ID }}
          MACRO_ARTICLE_LIMIT: "5"
          MACRO_DETECT_TOP_N: "2"
          TELEGRAM_NOTIFY_ERRORS: "false"
        # 스케줄 = 슬롯 서빙(헤더 + 6개 섹션 10분 간격), 수동 실행 = 전체 6개 한 번에(테스트용)
        run: python macro_section_telegram_bot.py ${{ github.event_name == 'schedule' && '--serve-slot' || '--once' }}
