name: Macro Section Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0,1,3,5,7,9,12,21,23 * * *"

permissions:
  contents: read

concurrency:
  group: macro-section-bot
  cancel-in-progress: true

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Run macro section bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.MACRO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MACRO_TELEGRAM_CHAT_ID }}
          RUN_MODE: once
          TELEGRAM_NOTIFY_ERRORS: true
          MACRO_ARTICLE_LIMIT: 15
          MACRO_VIEWPORT_WIDTH: 1440
          MACRO_VIEWPORT_HEIGHT: 1800
          MACRO_FULL_PAGE_SCREENSHOT: false
          MACRO_HEADLESS: true
        run: python macro_section_telegram_bot.py --once
