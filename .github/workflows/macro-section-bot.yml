name: Macro Section Bot

on:
  schedule:
    # KST 07:00, 10:30, 15:00, 21:00 (UTC = KST-9h). GitHub 부하에 따라 수 분 지연될 수 있음.
    - cron: "0 22,6,12 * * *"   # KST 07:00, 15:00, 21:00
    - cron: "30 1 * * *"        # KST 10:30
  workflow_dispatch: {}

concurrency:
  group: macro-section-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # 변경 감지 상태를 실행 간 유지 (없으면 매번 전부 "변경"으로 잡힘).
      - name: Restore change-detection state
        uses: actions/cache@v4
        with:
          path: macro_section_state.json
          key: macro-state-${{ github.run_id }}
          restore-keys: |
            macro-state-

      - name: Run bot (once)
        env:
          # 이 repo의 secret 이름은 MACRO_ 접두 → 봇이 읽는 범용 env명으로 매핑
          TELEGRAM_BOT_TOKEN: ${{ secrets.MACRO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MACRO_TELEGRAM_CHAT_ID }}
          RUN_MODE: once
          MACRO_ARTICLE_LIMIT: "5"
          MACRO_DETECT_TOP_N: "2"
          TELEGRAM_NOTIFY_ERRORS: "false"
        run: python macro_section_telegram_bot.py --once
