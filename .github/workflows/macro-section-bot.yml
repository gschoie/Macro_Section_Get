name: Macro Section Bot

on:
  schedule:
    # 슬롯(KST 07:00 / 10:30 / 15:00 / 21:00)마다 10분 간격으로 6번 깨어나,
    # 회전(--rotate)으로 섹션을 1개씩 보낸다 — 6연발 대신 10분에 하나씩.
    # UTC = KST-9h. GitHub 크론은 수 분 지연될 수 있음(순서는 상태 포인터가 보존).
    - cron: "0,10,20,30,40,50 22 * * *"   # KST 07:00~07:50
    - cron: "30,40,50 1 * * *"            # KST 10:30~10:50
    - cron: "0,10,20 2 * * *"             # KST 11:00~11:20
    - cron: "0,10,20,30,40,50 6 * * *"    # KST 15:00~15:50
    - cron: "0,10,20,30,40,50 12 * * *"   # KST 21:00~21:50
  workflow_dispatch: {}

# 크론 지연으로 두 틱이 겹치면 뒤 run이 줄을 선다(취소 아님) — 상태 파일 경합 방지.
concurrency:
  group: macro-section-bot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      # 크로미엄을 매번 새로 받으면 실행당 3분+ — 캐시로 실행시간을 1분 수준으로 줄인다.
      - name: Restore Playwright browser cache
        id: pw-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Playwright browser (cache miss)
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: python -m playwright install --with-deps chromium

      # 변경 감지 + 회전 포인터 상태를 실행 간 유지 (없으면 매번 전부 "변경"으로 잡힘).
      - name: Restore change-detection state
        uses: actions/cache@v5
        with:
          path: macro_section_state.json
          key: macro-state-${{ github.run_id }}
          restore-keys: |
            macro-state-

      - name: Run bot
        env:
          # 이 repo의 secret 이름은 MACRO_ 접두 → 봇이 읽는 범용 env명으로 매핑
          TELEGRAM_BOT_TOKEN: ${{ secrets.MACRO_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.MACRO_TELEGRAM_CHAT_ID }}
          MACRO_ARTICLE_LIMIT: "5"
          MACRO_DETECT_TOP_N: "2"
          TELEGRAM_NOTIFY_ERRORS: "false"
        # 스케줄 = 회전(섹션 1개), 수동 실행 = 전체 6개 한 번에(테스트용)
        run: python macro_section_telegram_bot.py ${{ github.event_name == 'schedule' && '--rotate' || '--once' }}
